<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đề 1 - Quản lý sách</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row mt-5 g-4">
        <div class="col-12 col-md-6">
          <h2>Quản lý sách</h2>
          <div class="mb-3">
            <label for="title" class="form-label">Tên sách</label>
            <input type="text" class="form-control" id="title" placeholder="Nhập tên sách" />
          </div>
          <div class="mb-3">
            <label for="author" class="form-label">Tác giả</label>
            <input type="text" class="form-control" id="author" placeholder="Nhập tên tác giả" />
          </div>
          <div class="mb-3">
            <label for="picture" class="form-label">Ảnh bìa</label>
            <input type="url" class="form-control" id="picture" placeholder="Nhập URL ảnh bìa" />
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Mô tả</label>
            <input type="text" class="form-control" id="description" placeholder="Nhập mô tả sách" />
          </div>
          <button type="button" class="btn btn-primary" id="btn_create">Thêm sách</button>
        </div>
        <div class="col-12 col-md-6">
          <h2>Danh sách sách</h2>
          <div id="books" class="row g-3"></div>
        </div>
      </div>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
